language: en-US

reviews:
  high_level_summary: true
  poem: false

  path_filters:
    - "!lib/**"
    - "!node_modules/**"
    - "!pnpm-lock.yaml"
    - "!coverage/**"

  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Follow the development guidelines in .github/coderabbit.md

    - path: "**/__tests__/**"
      instructions: |
        Follow the testing guidelines in .github/coderabbit.md
