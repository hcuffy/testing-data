# One weekly PR: every ecosystem below joins the `all-dependencies` multi-ecosystem group, and `patterns: ["*"]`
# takes every update type (major, minor and patch), so updates no longer conflict with each other.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday

updates:
  - package-ecosystem: npm
    directory: "/"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    multi-ecosystem-group: all-dependencies
    patterns: ["*"]
    groups:
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
